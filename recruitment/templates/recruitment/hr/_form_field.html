<div class="form-field{% if extra_class %} {{ extra_class }}{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}
    <p class="page-copy">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    <p class="field-error">{{ field.errors|striptags }}</p>
  {% endif %}
</div>
